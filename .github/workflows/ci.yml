name: PulseCart Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Microservices Fleet Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run All Automated Tests
        run: mvn clean test -B

  frontend-build:
    name: Frontend Applications Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Store Frontend
        working-directory: frontends/store
        run: |
          npm ci
          npm run build

      - name: Build Studio Frontend
        working-directory: frontends/studio
        run: |
          npm ci
          npm run build

  kubernetes-validation:
    name: Kubernetes & Helm Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kustomize Manifests
        run: kubectl kustomize infrastructure/kubernetes/base > /dev/null
