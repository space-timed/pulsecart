# PulseCart Production Helm Configuration Values

global:
  namespace: pulsecart
  environment: production
  imageRegistry: docker.io/pulsecart
  imagePullPolicy: IfNotPresent

# =============================================================================
# Shared Backing Services Configuration
# =============================================================================
infrastructure:
  postgres:
    host: pulsecart-postgres
    port: 5432
    username: pulsecart
    sslMode: disable
  redis:
    host: pulsecart-redis
    port: 6379
  kafka:
    bootstrapServers: pulsecart-kafka:9092

# =============================================================================
# Ingress Controller Configuration
# =============================================================================
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
  host: pulsecart.local
  tls: []

# =============================================================================
# Microservices Fleet Configurations
# =============================================================================
services:
  gateway:
    name: api-gateway
    replicas: 2
    port: 8080
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 75

  customer:
    name: customer-service
    replicas: 2
    port: 8081
    resources:
      requests:
