apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsecart-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "pulsecart.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: "kubernetes,production"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.infrastructure.kafka.bootstrapServers | quote }}
  SPRING_DATA_REDIS_HOST: {{ .Values.infrastructure.redis.host | quote }}
  SPRING_DATA_REDIS_PORT: {{ .Values.infrastructure.redis.port | quote }}
  POSTGRES_HOST: {{ .Values.infrastructure.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.infrastructure.postgres.port | quote }}
  POSTGRES_USER: {{ .Values.infrastructure.postgres.username | quote }}
  POSTGRES_SSLMODE: {{ .Values.infrastructure.postgres.sslMode | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
