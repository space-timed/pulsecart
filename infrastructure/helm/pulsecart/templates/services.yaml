{{- range $key, $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ $service.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: backend
    {{- include "pulsecart.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $service.name }}
{{- end }}

{{- range $key, $frontend := .Values.frontends }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $frontend.name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ $frontend.name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: frontend
    {{- include "pulsecart.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $frontend.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ $frontend.name }}
{{- end }}
