# PulseCart Microservices Kubernetes Services
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: pulsecart
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: api-gateway

