apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsecart-ingress
  namespace: pulsecart
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: pulsecart.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: store-ui
                port:
                  number: 3000
    - host: studio.pulsecart.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studio-ui
                port:
                  number: 3001
