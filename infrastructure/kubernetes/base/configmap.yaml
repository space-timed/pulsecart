apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsecart-config
  namespace: pulsecart
data:
  SPRING_PROFILES_ACTIVE: "kubernetes,production"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "pulsecart-kafka:9092"
  SPRING_DATA_REDIS_HOST: "pulsecart-redis"
  SPRING_DATA_REDIS_PORT: "6379"
  POSTGRES_HOST: "pulsecart-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "pulsecart"
  POSTGRES_SSLMODE: "disable"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
