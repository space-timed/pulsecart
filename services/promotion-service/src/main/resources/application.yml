server:
  port: 8085

spring:
  application:
    name: promotion-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/pulsecart_promotion
    username: ${DB_USER:pulsecart_admin}
    password: ${DB_PASSWORD:pulsecart_dev_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: pulsecart_promotion
        format_sql: false
  flyway:
    enabled: true
    schemas: pulsecart_promotion
    default-schema: pulsecart_promotion
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
